<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>

<style>
body{
    font-family: Arial, Helvetica, sans-serif;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background:black;
    color:white;
    transition:0.3s;
}

.calc{
    background:rgb(137, 173, 131);
    padding:35px;
    border-radius:15px;
    width:300px;
    transition:0.3s;
}

input{
    width:100%;
    height:50px;
    background:white;
    text-align:right;
    font-size:20px;
    margin-bottom:12px;
    border:2px solid red;
    box-sizing:border-box;
}

.buttons{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
}

button{
    height:50px;
    background:white;
    font-size:20px;
    border-radius:60px;
    cursor:pointer;
}

.themeBtn{
    margin-top:15px;
    width:100%;
}

footer{
    margin-top:20px;
}

/* DARK MODE */

.dark{
    background:#111;
    color:white;
}

.dark .calc{
    background:#222;
}

.dark input{
    background:#333;
    color:white;
    border-color:#666;
}

.dark button{
    background:#444;
    color:white;
}
</style>
</head>
<body>

<div class="calc">
    <h2>📱 Welcome to Calculator</h2>
    <p>Perform your calculations quickly and easily</p>
    <hr>

    <input type="text" placeholder="0" disabled id="a">

    <div class="buttons">
        <button onclick="cleardisplay()">C</button>
        <button onclick="clr()">DEL</button>
        <button onclick="pick('%')">%</button>
        <button onclick="pick('/')">/</button>

        <button onclick="pick(7)">7</button>
        <button onclick="pick(8)">8</button>
        <button onclick="pick(9)">9</button>
        <button onclick="pick('*')">*</button>

        <button onclick="pick(4)">4</button>
        <button onclick="pick(5)">5</button>
        <button onclick="pick(6)">6</button>
        <button onclick="pick('-')">-</button>

        <button onclick="pick(1)">1</button>
        <button onclick="pick(2)">2</button>
        <button onclick="pick(3)">3</button>
        <button onclick="pick('+')">+</button>

        <button onclick="pick(0)">0</button>
        <button onclick="pick('.')">.</button>
        <button onclick="calc()">=</button>
        <button onclick="pick('00')">00</button>
    </div>

    <button id="themeBtn" class="themeBtn" onclick="darkmode()">
        🌙 Dark Mode
    </button>
</div>

<footer>
    <p>2026 Calculator Project</p>
</footer>

<hr>

<h3>History</h3>
<div id="history">
    <p>No calculation yet.</p>
</div>

<p>Made by Mazin ❤️</p>

<script>
function pick(val){
    document.getElementById("a").value += val;
}

function cleardisplay(){
    document.getElementById("a").value = "";
}

function calc(){
    let exp = document.getElementById("a").value;

    try{
        let result = eval(exp);

        let history = document.getElementById("history");
        history.innerHTML += "<p>" + exp + " = " + result + "</p>";

        document.getElementById("a").value = result;
    }
    catch{
        document.getElementById("a").value = "Error";
    }
}

function clr(){
    let current = document.getElementById("a").value;
    document.getElementById("a").value = current.slice(0,-1);
}

function darkmode(){
    document.body.classList.toggle("dark");

    let btn = document.getElementById("themeBtn");

    if(document.body.classList.contains("dark")){
        btn.innerHTML = "☀️ Light Mode";
    }else{
        btn.innerHTML = "🌙 Dark Mode";
    }
}
</script>

</body>
</html>
